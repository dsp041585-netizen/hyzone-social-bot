<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root { --navy:#0B1B3D; --spruce:#0A4D3C; --gold:#C5A059; --ivory:#F4ECD8; --white:#FFFFFF; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
body { font-family: 'Manrope', sans-serif; }
.serif { font-family: 'Fraunces', serif; }
.root { width: 1080px; height: 1350px; overflow: hidden; display: flex; flex-direction: column; }
.top { display: flex; justify-content: space-between; align-items: center; }
.pill { padding: 12px 26px; border: 2px solid currentColor; border-radius: 999px; font-size: 22px; font-weight: 800; letter-spacing: 4px; }
.pill.solid { border-color: var(--gold); background: var(--gold); color: var(--navy); }
.wordmark { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 700; letter-spacing: 6px; }
.foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 24px; font-weight: 800; }
{% block style %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>

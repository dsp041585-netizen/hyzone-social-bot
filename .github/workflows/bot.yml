name: HyZone bot

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes: read your Telegram replies, post what's due
  workflow_dispatch:
    inputs:
      action:
        description: "run = normal check · this_week = fill the rest of this week · generate = draft next week now · test = sample posters"
        type: choice
        options: [run, this_week, generate, test]
        default: run
      force:
        description: "With generate: redo next week even if it's already drafted"
        type: boolean
        default: false

concurrency:
  group: hyzone-bot
  cancel-in-progress: false

permissions:
  contents: write   # lets the bot save its state and poster images to THIS repo only

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run the bot
        env:
          ACTION: ${{ inputs.action || 'run' }}
          FORCE: ${{ inputs.force || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m bot.run

      - name: Save state and posters
        if: always()
        run: |
          git config user.name "hyzone-bot"
          git config user.email "hyzone-bot@users.noreply.github.com"
          git add state posts
          if ! git diff --cached --quiet; then
            git commit -m "bot: update state [skip ci]"
            git pull --rebase
            git push
          fi
